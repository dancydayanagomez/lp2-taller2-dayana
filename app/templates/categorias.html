{% extends "base.html" %}
{% block titulo %}Categorías{% endblock %}
{% block contenido %}
<h2>Listado de categorías</h2>
<ul>
    {% for cat in categorias %}
        <li>{{ cat.nombre }} ({{ cat.productos|length }} productos)</li>
    {% endfor %}
</ul>
<a href="{{ url_for('main.index') }}">Volver al catálogo</a>
{% endblock %}
